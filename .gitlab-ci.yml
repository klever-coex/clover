stages:
  - docs

.docker-setup:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_REGISTRY_PASSWORD" | docker login registry.gitlab.com --username $DOCKER_REGISTRY_USER --password-stdin

.docker-build-docs:
  extends: .docker-setup
  stage: docs
  script:
    - export IMAGE_TAG=$(echo $CI_COMMIT_SHA | cut -c1-8)
    - docker build -t "registry.gitlab.com/coex2/clover/clover-docs:$IMAGE_TAG" -f docker/docs/Dockerfile .
    - docker push "registry.gitlab.com/coex2/clover/clover-docs:$IMAGE_TAG"

docker-build-docs-master:
  extends: .docker-build-docs
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"

docker-build-docs-mr:
  extends: .docker-build-docs
  only:
    - merge_request
